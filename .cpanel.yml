---
# Deploy no HostGator (cPanel > Git Version Control > Implantar commit HEAD).
# Todos os comandos usam o caminho do site explicitamente: o Composer e o artisan
# nunca rodam dentro da cópia do repositório, então o "Atualizar do remoto" não
# encontra arquivos alterados localmente.
deployment:
  tasks:
    - export DEPLOYPATH=/home1/inova7/coordenacao.inova7.com.br/
    - /bin/cp -R . $DEPLOYPATH
    - export PATH="/home1/inova7:$PATH"
    - php /home1/inova7/composer install --working-dir=$DEPLOYPATH --no-interaction --prefer-dist --no-progress --no-dev
    - php /home1/inova7/composer dump-autoload --working-dir=$DEPLOYPATH --no-dev
    - php ${DEPLOYPATH}artisan config:clear
    - php ${DEPLOYPATH}artisan cache:clear
    - php ${DEPLOYPATH}artisan route:clear
    - php ${DEPLOYPATH}artisan view:clear
    - php ${DEPLOYPATH}artisan migrate --force
